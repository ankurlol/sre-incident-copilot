name: SRE Copilot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          ADMIN_EMAIL: "admin@company.com"
          ADMIN_KEY: "ci_test_key_123"
          SIMULATE_GITHUB_ACTIONS: "true"
        run: |
          python -m pytest tests/test_otp_auth.py tests/test_admin_portal.py tests/test_scenarios.py -v

  docker-build:
    name: Validate Docker Container Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sre-incident-copilot:ci-test
